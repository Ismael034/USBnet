[binaries]
c = 'riscv32-wch-elf-gcc'
strip = 'riscv32-wch-elf-strip'

[host_machine]
system = 'baremetal'
cpu_family = 'riscv32'
cpu = 'rv32imacxw'
endian = 'little'

[built-in options]
c_args = ['-march=rv32imacxw', '-mabi=ilp32', '-O2', '-ffunction-sections', '-fdata-sections', '-fno-common']
c_link_args = ['-march=rv32imacxw', '-mabi=ilp32', '-nostartfiles', '-Wl,--gc-sections', '--specs=nano.specs', '--specs=nosys.specs']
